name: Verify

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Lint
        run: npm.cmd run lint

      - name: Build and type-check
        run: npm.cmd run build
